name: last-payload-tanstack-start-template

# Local Postgres matching .env (demo/demo-secret-pw@127.0.0.1:5434/template_demo).
# Usage: docker compose up -d postgres, then bun run db:migrate.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-secret-pw
      POSTGRES_DB: template_demo
    ports:
      - '5434:5432'
    volumes:
      # 18+ sets PGDATA=/var/lib/postgresql/18/docker, so the volume mounts the parent.
      # A 16.x volume is not upgraded in place: reset it (`docker compose down -v`) or pg_upgrade.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d template_demo']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
